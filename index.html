<!DOCTYPE html>
<html>
<head>
  <title>HomeKit KI</title>
</head>
<body>
  <h2>Heizungs- & Smart-Home-Berater</h2>
  <textarea id="question" placeholder="Deine Frage hier"></textarea><br>
  <button onclick="askAI()">Frage stellen</button>
  <div id="answer"></div>

  <script>
    async function askAI() {
      const question = document.getElementById("question").value;

      // Render-Backend URL eintragen
      const response = await fetch("https://home-kit-ai.onrender.com/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      const data = await response.json();
      document.getElementById("answer").innerText = data.answer;
    }
  </script>
</body>
</html>
